name: taskaway
description: "A task outsourcing platform for Malaysia"
publish_to: 'none'

version: 1.1.6+10

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.10.3
  formz: ^0.8.0
  flutter_svg: ^2.2.2
  cached_network_image: ^3.3.2
  shimmer: ^3.0.0
  markdown: ^7.2.1
  go_router: ^17.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  path: ^1.9.0
  logger: ^2.6.2
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  http: ^1.6.0
  google_fonts: ^6.3.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.2
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3
  firebase_analytics: ^12.0.4
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  web: ^1.1.1
  app_links: ^6.4.1
  webview_flutter: ^4.11.2 # Used for CHIPP payment gateway WebView
  # Replacing url_strategy with flutter_web_plugins configuration
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  google_places_flutter: ^2.0.9
  photo_view: ^0.15.0
  sign_in_with_apple: ^7.0.1
  app_tracking_transparency: ^2.0.4
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.woff2
        - asset: assets/fonts/Inter-Medium.woff2
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Inter-Bold.woff2
          weight: 700

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#FFC333"
  image_path: "assets/images/logo_square.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_square.png"
